spring:
  application:
    name: giwa

  sql:
    init:
      mode: never

  datasource:
    url: "jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:giwa_receivable}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:local-mvp-jwt-secret-key-must-be-long-enough}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  blockchain:
    rpc-url: ${GIWA_RPC_URL:https://sepolia-rpc.giwa.io}
    chain-id: ${GIWA_CHAIN_ID:91342}
    receivable-finance-address: ${GIWA_RECEIVABLE_FINANCE_ADDRESS:0x0f264334f98BA0d22f7Fc6Bb901a5Fa36158a315}
    mock-krw-address: ${GIWA_MOCK_KRW_ADDRESS:0x5cD8a99Dcf5Fa00fb4fD9873b41A15F9C13C9d3F}
    rpc-timeout-ms: ${GIWA_RPC_TIMEOUT_MS:10000}
    min-confirmations: ${GIWA_MIN_CONFIRMATIONS:1}
