spring:
  application:
    name: giwa

  sql:
    init:
      mode: never

  datasource:
#    url: ${DB_URL:jdbc:log4jdbc:mysql://localhost:3306/giwa_receivable?serverTimezone=Asia/Seoul}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:giwa_receivable}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:local-mvp-jwt-secret-key-must-be-long-enough}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
